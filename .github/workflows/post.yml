name: Mia posten
on:
  schedule:
    - cron: "10 16 * * *"
    - cron: "10 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "verify = nur Konto prüfen, run = fällige Beiträge posten"
        default: "verify"
        type: choice
        options: [verify, run]
permissions:
  contents: write
concurrency:
  group: mia-posten
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ausführen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python post.py "${{ github.event.inputs.mode || 'run' }}"
      - name: Stand speichern
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "mia-bot"
            git config user.email "mia-bot@users.noreply.github.com"
            git add posted.json
            git commit -m "Gepostet: Stand aktualisiert"
            git push
          fi
